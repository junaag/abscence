<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090c0f">
<title>ABSENCE — Preview mobile 0.1.8</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#090c0f;--panel:#11161b;--line:#26303a;--text:#f1f4f6;--muted:#93a0ac;--accent:#e7b94b;--danger:#d55c5c;--good:#73b98b;--blue:#74a6d8}*{box-sizing:border-box}html,body{margin:0;background:#050709;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{min-height:100dvh}button{font:inherit}#app{width:min(100%,520px);min-height:100dvh;margin:auto;background:var(--bg);padding-bottom:72px}header{position:sticky;top:0;z-index:3000;background:#0b0f13f7;padding:10px 14px;border-bottom:1px solid var(--line)}.top{display:flex;gap:10px}.world{flex:1;min-width:0}.line{display:flex;align-items:center;white-space:nowrap;overflow:hidden}.time{font-size:16px;font-weight:900}.dot{margin:0 7px;color:#53606a}.part,.loc{font-size:10px;font-weight:900;text-transform:uppercase}.loc{color:var(--muted);overflow:hidden;text-overflow:ellipsis}.weather{font-size:10px;color:#aebac3;margin-top:5px}.menu{width:38px;height:38px;border:1px solid #35424c;border-radius:9px;background:#12191f;color:#dce5eb;font-size:21px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}.stat{text-align:center}.ico{font-weight:900;font-size:16px}.val{display:block;font-size:11px;font-weight:900;margin-top:3px}main{padding:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.kicker{font-size:9px;color:#788791;font-weight:900;letter-spacing:1px;text-transform:uppercase}.title{font-size:24px;font-weight:900;line-height:1.05;margin-top:4px}.copy{font-size:13px;color:#b5c0c7;line-height:1.55;margin-top:10px}.result{border-left:3px solid var(--accent);padding-left:12px}.rlabel{font-size:8px;font-weight:900;color:#9ca9b1;letter-spacing:1px;text-transform:uppercase}.rtitle{font-size:16px;font-weight:900;margin-top:4px}.rbody{font-size:12px;color:#b8c2c8;line-height:1.5;margin-top:5px}.effects{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{font-size:9px;font-weight:900;border:1px solid #3b4852;background:#192127;border-radius:999px;padding:5px 7px;color:#cbd5db}.section{font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#8d9aa3;margin:3px 0 8px}.action{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:#131a20;border:1px solid #2d3942;border-radius:12px;padding:12px;color:#eef3f6;margin:7px 0}.acopy{flex:1}.atitle{font-size:13px;font-weight:900}.asub{font-size:10px;color:#8998a2;margin-top:3px}.chev{font-size:22px;color:#66757f}.item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid #2b3740;border-radius:12px;background:#12191f;margin-top:7px}.itemicon{width:34px;height:34px;border-radius:9px;background:#1e282f;display:grid;place-items:center}.itemcopy{flex:1}.itemname{font-size:12px;font-weight:900}.itemmeta{font-size:9px;color:#82909a;margin-top:3px}nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:3500;width:min(100%,520px);height:68px;background:#0a0e12fa;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;background:transparent;color:#788791;font-size:9px;font-weight:900;text-transform:uppercase}.nav span{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:var(--accent)}.overlay{position:fixed;inset:0;z-index:6000;background:#000b;display:grid;place-items:end center}.panel{width:min(100%,520px);max-height:82dvh;overflow:auto;background:#0f151a;border:1px solid #34414b;border-radius:20px 20px 0 0;padding:14px}.phead{display:flex;align-items:center;justify-content:space-between}.ptitle{font-size:19px;font-weight:900}.close{width:36px;height:36px;border-radius:9px;border:1px solid #34414b;background:#171f25;color:#dce5eb;font-size:20px}#map{height:calc(100dvh - 165px);min-height:430px;background:#151a1d;border-radius:16px;overflow:hidden;border:1px solid #2f3c45}.mapshell{position:relative}.mapstatus{position:absolute;top:10px;left:10px;z-index:800;background:#0b1116eb;border:1px solid #3b4852;border-radius:9px;padding:7px 9px;font-size:9px;font-weight:900}.fog{position:absolute;inset:0;z-index:500;pointer-events:none;background:radial-gradient(circle 150px at 50% 50%,transparent 0 40%,rgba(75,82,87,.82) 58%,rgba(69,76,82,.97) 100%),repeating-linear-gradient(35deg,rgba(255,255,255,.035) 0 2px,rgba(0,0,0,.025) 2px 5px)}.track{height:7px;border-radius:99px;background:#222c33;overflow:hidden}.fill{height:100%;border-radius:99px}.statrow{display:grid;grid-template-columns:70px 1fr 54px;gap:8px;align-items:center;font-size:10px;margin:10px 0}.note{font-size:10px;color:#7f8d96;line-height:1.45}
</style>
</head>
<body><div id="app"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{'use strict';const KEY='absence-preview-v018',cl=(v,a=0,b=100)=>Math.min(b,Math.max(a,+v||0)),pad=n=>String(n).padStart(2,'0');
function fresh(){return{version:'0.1.8',time:{h:7,m:12},loc:'Chambre',locId:'bedroom',screen:'home',stats:{health:100,hunger:12,thirst:10,fatigue:18,stress:22,pain:0},inventory:['phone'],items:{phone:{name:'Téléphone',type:'phone',battery:78},apple:{name:'Pomme',type:'apple',freshness:94},water:{name:'Bouteille d’eau 50 cl',type:'water',ml:500}},result:{title:'Quelque chose ne va pas.',body:'Le silence de la maison est anormal. Vous êtes réveillé, seul, et aucune voix ne répond.',effects:[]},elapsed:0}}
let s=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}})(),map=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(s));
function advance(sec){const min=sec/60;s.stats.hunger=cl(s.stats.hunger+min/25);s.stats.thirst=cl(s.stats.thirst+min/15);s.stats.fatigue=cl(s.stats.fatigue+min/20);if(s.stats.thirst>75)s.stats.health=cl(s.stats.health-(min/45)*((s.stats.thirst-75)/25));let t=s.time.h*60+s.time.m+min;s.time={h:Math.floor(t/60)%24,m:Math.floor(t%60)};s.elapsed+=sec;save()}
function res(t,b,e=[]){s.result={title:t,body:b,effects:e};save();render()}
function col(k,v){if(k==='health')return v<=25?'var(--danger)':v<=55?'var(--accent)':'var(--good)';return v>=75?'var(--danger)':v>=45?'var(--accent)':'var(--blue)'}
function hud(){const M=[['health','♥'],['hunger','◒'],['thirst','◆'],['fatigue','Zz'],['stress','!'],['pain','+']];return `<header><div class="top"><div class="world"><div class="line"><span class="time">${pad(s.time.h)}:${pad(s.time.m)}</span><span class="dot">•</span><span class="part">Matin</span><span class="dot">•</span><span class="loc">${s.loc}</span></div><div class="weather">☀ 24°C · Ensoleillé · vent faible</div></div><button class="menu" onclick="menu()">☰</button></div><div class="stats">${M.map(([k,i])=>`<div class="stat"><span class="ico" style="color:${col(k,s.stats[k])}">${i}</span><span class="val" style="color:${col(k,s.stats[k])}">${k==='health'?Math.round(s.stats[k])+' PV':Math.round(s.stats[k])+'%'}</span></div>`).join('')}</div></header>`}
function result(){let r=s.result;return `<div class="card result"><div class="rlabel">Résultat de l’action</div><div class="rtitle">${r.title}</div><div class="rbody">${r.body}</div>${r.effects.length?`<div class="effects">${r.effects.map(x=>`<span class="pill">${x}</span>`).join('')}</div>`:''}</div>`}
const action=(t,sub,fn)=>`<button class="action" onclick="${fn}"><div class="acopy"><div class="atitle">${t}</div><div class="asub">${sub}</div></div><div class="chev">›</div></button>`;
function rows(){return s.inventory.map(id=>{let x=s.items[id],meta=x.type==='phone'?`Batterie ${x.battery}%`:x.type==='apple'?`Fraîcheur ${Math.round(x.freshness)}%`:`${x.ml} ml`;return `<div class="item" onclick="item('${id}')"><div class="itemicon">${x.type==='phone'?'▣':x.type==='apple'?'●':'◒'}</div><div class="itemcopy"><div class="itemname">${x.name}</div><div class="itemmeta">${meta}</div></div><div class="chev">›</div></div>`}).join('')}
function home(){let bed=s.locId==='bedroom',scene=bed?'Vous êtes assis sur le bord du lit. La place à côté de vous est vide. Aucun bruit de circulation, aucune voix dans la maison. Votre téléphone est à portée de main.':'La cuisine est éclairée par la lumière du matin. Une pomme est posée près de l’évier. Le réfrigérateur ronronne encore.',acts=bed?[action('Appeler votre épouse à haute voix','Écouter si quelqu’un répond.','shout()'),action('Aller dans la cuisine','Traverser la maison.','move()'),action('Observer la chambre','Regarder autour de vous.','observe()')]:[action('Retourner dans la chambre','Revenir au point de départ.','move()'),action('Prendre la pomme','Ajouter la pomme à l’inventaire.','takeApple()'),action('Boire au robinet','Boire environ 25 cl.','drinkTap()'),action('Prendre la bouteille d’eau','Ajouter la bouteille à l’inventaire.','takeWater()')];return `<main><div class="card"><div class="kicker">Preview moteur 0.1.8</div><div class="title">${s.loc}</div><div class="copy">${scene}</div></div>${result()}<div class="section">Actions</div>${acts.join('')}<div class="section" style="margin-top:16px">Sur vous</div>${rows()}</main>`}
function inv(){return `<main><div class="card"><div class="kicker">Inventaire</div><div class="title">Sur vous</div></div>${rows()}</main>`}
function state(){let M=[['health','Santé'],['hunger','Faim'],['thirst','Soif'],['fatigue','Fatigue'],['stress','Stress'],['pain','Douleur']];return `<main><div class="card"><div class="kicker">État physique</div><div class="title">Indicateurs</div><div class="copy">Santé en PV. Les autres indicateurs sont en %.</div></div><div class="card">${M.map(([k,n])=>`<div class="statrow"><b>${n}</b><div class="track"><div class="fill" style="width:${cl(s.stats[k])}%;background:${col(k,s.stats[k])}"></div></div><b style="text-align:right">${k==='health'?Math.round(s.stats[k])+' PV':Math.round(s.stats[k])+'%'}</b></div>`).join('')}</div></main>`}
function mapView(){return `<main style="padding:10px"><div class="mapshell"><div id="map"></div><div class="fog"></div><div class="mapstatus">EXPLORATION · OSM</div></div></main>`}
function render(){document.getElementById('app').innerHTML=hud()+(s.screen==='home'?home():s.screen==='inventory'?inv():s.screen==='state'?state():mapView())+`<nav>${[['home','⌂','Accueil'],['map','◇','Carte'],['inventory','▤','Inventaire'],['state','◉','État']].map(([id,ic,n])=>`<button class="nav ${s.screen===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${n}</button>`).join('')}</nav>`;if(s.screen==='map')setTimeout(initMap);save()}
window.go=x=>{s.screen=x;render()};window.move=()=>{advance(27);s.locId=s.locId==='bedroom'?'kitchen':'bedroom';s.loc=s.locId==='kitchen'?'Cuisine':'Chambre';res('Vous changez de pièce.','La maison reste étrangement silencieuse.',['27 s'])};window.shout=()=>{advance(12);s.stats.stress=cl(s.stats.stress+2);res('Aucune réponse.','Votre voix traverse la maison. Rien. Pas un mouvement, pas une voix en retour.',['12 s','+2% stress'])};window.observe=()=>{advance(25);res('La chambre est intacte.','Rien n’indique un départ précipité. L’absence de bruit extérieur reste le détail le plus inquiétant.',['25 s'])};window.takeApple=()=>{if(!s.inventory.includes('apple'))s.inventory.push('apple');advance(5);res('Vous prenez la pomme.','Vous la glissez avec vos affaires.',['5 s','+ Pomme'])};window.takeWater=()=>{if(!s.inventory.includes('water'))s.inventory.push('water');advance(3);res('Vous prenez la bouteille d’eau.','Elle contient encore 50 cl.',['3 s'])};window.drinkTap=()=>{advance(20);s.stats.thirst=cl(s.stats.thirst-15);res('Vous buvez au robinet.','L’eau coule encore.',['20 s','-15% soif'])};window.closeP=()=>document.getElementById('ov')?.remove();
window.item=id=>{let x=s.items[id],o=document.createElement('div');o.className='overlay';o.id='ov';let a=x.type==='apple'?action('Manger la pomme','Réduit la faim et légèrement la soif.','eatApple()'):x.type==='water'?action('Boire 25 cl','Réduit la soif.','drinkBottle()'):action('Consulter le téléphone','Batterie et réseau.','phone()');o.innerHTML=`<div class="panel"><div class="phead"><div class="ptitle">${x.name}</div><button class="close" onclick="closeP()">×</button></div>${a}</div>`;document.body.appendChild(o)};window.eatApple=()=>{if(!s.inventory.includes('apple'))return;advance(120);s.stats.hunger=cl(s.stats.hunger-9);s.stats.thirst=cl(s.stats.thirst-4);s.inventory=s.inventory.filter(x=>x!=='apple');closeP();res('Vous mangez la pomme.','Elle est encore fraîche.',['2 min','-9% faim','-4% soif'])};window.drinkBottle=()=>{let x=s.items.water;if(x.ml<250)return;advance(18);x.ml-=250;s.stats.thirst=cl(s.stats.thirst-15);closeP();res('Vous buvez 25 cl.','L’eau est à température ambiante.',['18 s','-15% soif'])};window.phone=()=>{closeP();res('Téléphone','Batterie 78 %. Aucun nouveau message. Le réseau semble encore disponible.',['Batterie 78%'])};window.menu=()=>{let o=document.createElement('div');o.className='overlay';o.id='ov';o.innerHTML=`<div class="panel"><div class="phead"><div class="ptitle">Menu test</div><button class="close" onclick="closeP()">×</button></div>${action('Avancer de 1 heure','Tester le moteur.','debug(3600)')}${action('Réinitialiser la partie','Effacer la sauvegarde locale.','reset()')}<div class="card note">Preview GitHub · moteur 0.1.8 intégré</div></div>`;document.body.appendChild(o)};window.debug=n=>{closeP();advance(n);res('Le temps passe.','Vous laissez une heure s’écouler.',['1 h'])};window.reset=()=>{localStorage.removeItem(KEY);location.reload()};
function initMap(){let el=document.getElementById('map');if(!el||!window.L)return;if(map)try{map.remove()}catch(e){}let home=[43.4059,5.0474];map=L.map(el).setView(home,17);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);L.marker(home).addTo(map).bindPopup('<b>Maison</b><br>Point de départ');setTimeout(()=>map.invalidateSize(),100)}render();})();
</script></body></html>
