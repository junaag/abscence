(async()=>{
  async function decodeGzipBase64(text){
    const bytes=Uint8Array.from(atob(text),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window))throw new Error('DecompressionStream unsupported');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  let encoded='';
  for(let i=1;i<=4;i++){const r=await fetch(`engine-b64/part-${i}.txt`,{cache:'no-store'});if(!r.ok)throw new Error(`engine part ${i}`);encoded+=await r.text()}
  (0,eval)(await decodeGzipBase64(encoded));

  (0,eval)(await decodeGzipBase64(await largeEngine.text()));

  (0,eval)(await decodeGzipBase64(await appResponse.text()));

})().catch(err=>{console.error(err);document.getElementById('app').innerHTML='<main style="padding:16px"><div class="card"><b>Erreur de chargement</b><div class="copy">Le moteur v0.1.11 n’a pas pu être chargé.</div></div></main>'});
