name: Refresh npm lockfile

on:
  push:
    branches: ['refactor/v020-clean-architecture']
    paths:
      - 'package.json'
      - '.github/workflows/lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when dependency graph changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain package-lock.json)" ]; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock npm dependency graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
